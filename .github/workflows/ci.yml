name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install --no-deps .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run the offline demo
        run: briefcheck demo

      - name: Verify fixture reports with briefcheck CLI
        run: |
          briefcheck verify --report examples/csv-export/expected.md --diff examples/csv-export/change.diff --test-log examples/csv-export/test-run.log --strict-warnings
          briefcheck verify --report examples/prompt-injection-auth/expected.md --diff examples/prompt-injection-auth/change.diff --strict-warnings
          briefcheck verify --report examples/retry-backoff/expected.md --diff examples/retry-backoff/change.diff --test-log examples/retry-backoff/test-run.log
          briefcheck check --input examples/prompt-injection-auth/expected.md --diff examples/prompt-injection-auth/change.diff --require-citations --strict-warnings

      - name: Smoke test MCP stdio server
        run: |
          python -c "import json, subprocess, sys; req = json.dumps({'jsonrpc':'2.0','id':1,'method':'tools/list'}) + '\n'; p = subprocess.run([sys.executable, '-m', 'briefcheck', 'mcp'], input=req, text=True, capture_output=True, check=True); data = json.loads(p.stdout.strip()); assert len(data['result']['tools']) == 4, data"
