[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "briefcheck"
version = "0.5.0"
description = "Catch hallucinated diff citations in any AI PR review — zero-dependency Python CLI, MCP server, Agent Skill, and GitHub Action."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "BriefCheck contributors" },
]
keywords = [
  "code-review",
  "ai-code-review",
  "pull-request",
  "github",
  "diff",
  "mcp",
  "mcp-server",
  "claude-code",
  "codex",
  "agent-skill",
  "verification",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/yulongwu-x/BriefCheck"
Repository = "https://github.com/yulongwu-x/BriefCheck"
Issues = "https://github.com/yulongwu-x/BriefCheck/issues"

[project.scripts]
briefcheck = "briefcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
